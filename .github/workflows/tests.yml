name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Bundle integrity (exact bytes)
        run: python -X utf8 scripts/verify_bundle.py
      - name: Unit and integration tests
        run: python -X utf8 -B -m unittest discover -s tests -p "test_*.py"

  render-libreoffice:
    # Real pagination, TOC page numbers, page images and the rendered-page audit on
    # all three systems. Static acceptance (case 07) and full visual acceptance are
    # reported separately; refused defect cases must be refused.
    name: real render · LibreOffice · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice and the same Noto CJK fonts on Linux and macOS
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk fonts-liberation ;;
            Windows)
              choco install libreoffice-fresh -y --no-progress ;;
            macOS)
              brew install --cask libreoffice font-noto-serif-cjk-sc font-noto-sans-cjk-sc ;;
          esac
      - run: python -m pip install -r requirements.txt
      - name: Font diagnosis (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          ls ~/Library/Fonts | head; ls /System/Library/Fonts | head -50
          cat > "$RUNNER_TEMP/diag.py" <<'PY'
          import os, subprocess, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from docx import Document
          from docx.oxml.ns import qn
          import pymupdf
          import office_backend as B
          tmp = Path(tempfile.mkdtemp())
          for name in ["宋体", "SimSun", "Noto Serif CJK SC", "PingFang SC", "Songti SC"]:
              d = Document()
              r = d.add_paragraph().add_run("学号：20230001 中文测试")
              r.font.name = name
              r._r.get_or_add_rPr().get_or_add_rFonts().set(qn("w:eastAsia"), name)
              src = tmp / f"t{abs(hash(name))}.docx"
              d.save(src)
              for label, plugin in [("default", None), ("svp", "svp"), ("osx", "osx")]:
                  work = Path(tempfile.mkdtemp())
                  if plugin:
                      os.environ["SAL_USE_VCLPLUGIN"] = plugin
                  else:
                      os.environ.pop("SAL_USE_VCLPLUGIN", None)
                  try:
                      B._lo(src, work / "o.pdf", {"path": "/Applications/LibreOffice.app/Contents/MacOS/soffice"}, work)
                      with pymupdf.open(work / "o.pdf") as p:
                          print(name, label, [f[3] for f in p[0].get_fonts()], repr(p[0].get_text()[:40]), flush=True)
                  except Exception as e:
                      print(name, label, "ERROR", str(e)[:300], flush=True)
          PY
          python -X utf8 "$RUNNER_TEMP/diag.py"
      - name: Unit tests including the real-render audit tests
        if: runner.os == 'Linux'
        run: python -X utf8 -B -m unittest discover -s tests -p "test_*.py"
      - name: Acceptance cases through the agent-facing commands
        run: python -X utf8 tests/run_acceptance.py --output-dir "$RUNNER_TEMP/acceptance"
      - name: Keep page images for people to look at
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-pages-libreoffice-${{ matrix.os }}
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: ignore
